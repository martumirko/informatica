<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
   <h1>Funciones en JS</h1> 
   <button onclick="saludar()">Saludo</button>
   <h2>Parametros y Argumentos</h2>
   <button onclick="solicitarDatos()">Ejemplo</button>
   <script>
    function saludar(){
        let nombre=prompt("Escribe tu nombre");
        if (nombre){
            alert("Buenas,"+nombre);
        }else{
            alert("Debes escribir tu nombre");
        }
    }
    function calcularPrecio(precio,cantidad){
      let total=precio*cantidad;
      alert("El precio total es:"+total);
    }
        function solicitarDatos(){
        let solicitarPrecio=prompt("Ingrese el costo del producto");
        let solicitarCantidad=prompt("Colocar las unidades");
        calcularPrecio(solicitarPrecio,solicitarCantidad);
    }
   </script>
</body>
</html>
